# Marketing screenshots, captured by `make` in this directory against the
# throwaway stack it starts (see Makefile / seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.
#
# repo-helper reuses one browser session, so order matters: Home runs after
# the record pages, and the calendar runs after the insert form (which
# remembers the last view used).

[DEFAULT]
base_url = http://127.0.0.1:18480/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/sidebar.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = SickRock
manifest_base_url = https://raw.githubusercontent.com/jamesread/SickRock/main/var/marketing/screenshots/

[table]
url = table/jobs
title = Tables on your own database
description = Browse a real database table as a sortable, filterable list, with friendly column labels, currency formatting and linked records. Saved views let each user choose which columns they see.

[row]
url = table/clients/1
title = Records with related rows
description = Each record gets its own page with fields grouped into sections, inline editing, and the rows that reference it (here, a client's jobs) listed underneath.

[insert-row]
url = table/jobs/insert-row
title = Forms for data entry
description = Add rows through a generated form with date pickers and a searchable picker for linked records, without writing any code.

[calendar]
url = table/jobs
script = scripts/light.py, scripts/sidebar.py, scripts/prepare.py, scripts/calendar.py
title = Calendar view
description = Any table with a start date can be shown as a calendar, so schedules and bookings can be planned at a glance and shared as a read-only export.

[home]
url = .
script = scripts/light.py, scripts/sidebar.py, scripts/recent.py, scripts/prepare.py
title = Home
description = The home page brings back the records you looked at most recently, and the sidebar groups your tables into apps such as Customers and Operations.

[control-panel]
url = admin/control-panel
title = Control panel
description = Administrators manage tables, navigation, dashboards, users, roles and health checks from one control panel, all inside the browser.

# Dark variants last; the browser session (and localStorage) is shared.
[table-dark]
url = table/jobs
script = scripts/dark.py, scripts/sidebar.py, scripts/prepare.py
theme = dark
title = Dark mode
description = The whole interface is also available in a dark theme.
